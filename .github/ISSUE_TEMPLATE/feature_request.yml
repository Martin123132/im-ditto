name: Suggest an improvement
description: Tell us the job you want Ditto to make easier.
body:
  - type: textarea
    id: job
    attributes:
      label: What are you trying to do?
      description: Describe the job in your own words. Please leave private work and credentials out.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What would make it easier?
      description: A small example is helpful. You do not need to design the technical solution.
    validations:
      required: true
