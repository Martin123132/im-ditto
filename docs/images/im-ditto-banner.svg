<text x="48" y="182" fill="#f4f7f3" font-family="Segoe UI,Arial,sans-serif" font-size="49" font-weight="700">Make a workspace</text>
<text x="48" y="242" fill="#c2ef89" font-family="Segoe UI,Arial,sans-serif" font-size="49" font-weight="700">that works like you.</text>
<text x="50" y="335" fill="#b8c7c6" font-family="Segoe UI,Arial,sans-serif" font-size="22">An idea is a good place to start.</text>
