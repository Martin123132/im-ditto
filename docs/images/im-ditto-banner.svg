<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">I’m-Ditto</title><desc id="desc">Make a workspace that works like you. Describe, build, make it yours.</desc>
